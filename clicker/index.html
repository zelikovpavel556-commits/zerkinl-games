<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Material 3 Expressive Clicker</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;600;800;1000&display=swap" rel="stylesheet">

  <style>
    /* Светлая тема M3 */
    :root {
      --md-sys-color-background: #fbf8ff;
      --md-sys-color-surface-container-lowest: #ffffff;
      --md-sys-color-surface-container-high: #efe7f6;
      --md-sys-color-primary: #6b4ea2;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #ebdcfd;
      --md-sys-color-on-primary-container: #25085e;
      --md-sys-color-outline: #7c7484;
      --md-shape-corner-extra-large: 28px;
      --md-shape-corner-full: 9999px;
      --particle-1: #6b4ea2;
      --particle-2: #9b72cf;
      --particle-3: #c8b2ed;
    }

    /* Темная тема M3 */
    [data-theme="dark"] {
      --md-sys-color-background: #141218;
      --md-sys-color-surface-container-lowest: #1d1b20;
      --md-sys-color-surface-container-high: #2b2930;
      --md-sys-color-primary: #d3bbff;
      --md-sys-color-on-primary: #3b1d71;
      --md-sys-color-primary-container: #533788;
      --md-sys-color-on-primary-container: #ebdcfd;
      --md-sys-color-outline: #958da1;
      --particle-1: #d3bbff;
      --particle-2: #b69df8;
      --particle-3: #8a65cd;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: 'Roboto Flex', sans-serif;
      background-color: var(--md-sys-color-background);
      color: var(--md-sys-color-on-primary-container);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .app-card {
      background-color: var(--md-sys-color-surface-container-lowest);
      border-radius: var(--md-shape-corner-extra-large);
      padding: 32px 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      position: relative;
      overflow: hidden;
      transition: background-color 0.3s ease;
    }

    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-tag {
      background-color: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-primary);
      padding: 6px 16px;
      border-radius: var(--md-shape-corner-full);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Кнопка переключения темы */
    .theme-toggle {
      background-color: var(--md-sys-color-surface-container-high);
      border: none;
      width: 40px;
      height: 40px;
      border-radius: var(--md-shape-corner-full);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.3s ease, transform 0.2s;
    }

    .theme-toggle:active {
      transform: scale(0.9);
    }

    .theme-toggle svg {
      width: 20px;
      height: 20px;
      fill: var(--md-sys-color-primary);
      transition: fill 0.3s ease;
    }

    .score-display {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .score-value {
      font-size: 64px;
      font-weight: 1000;
      line-height: 1;
      color: var(--md-sys-color-primary);
      transition: color 0.3s ease;
    }

    .score-label {
      font-size: 14px;
      font-weight: 600;
      opacity: 0.7;
    }

    .click-button-wrapper {
      position: relative;
      width: 180px;
      height: 180px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .click-button {
      width: 100%;
      height: 100%;
      border-radius: var(--md-shape-corner-full);
      background-color: var(--md-sys-color-primary-container);
      border: 4px solid var(--md-sys-color-primary);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.15s cubic-bezier(0.2, 0, 0, 1), background-color 0.3s ease, border-color 0.3s ease;
      outline: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      position: relative;
      z-index: 2;
    }

    .click-button:active {
      transform: scale(0.92);
      background-color: var(--md-sys-color-primary);
    }

    .click-button:active .click-icon {
      fill: var(--md-sys-color-on-primary);
    }

    .click-icon {
      width: 64px;
      height: 64px;
      fill: var(--md-sys-color-primary);
      transition: fill 0.2s;
    }

    /* Анимация всплывающего текста */
    .floating-text {
      position: absolute;
      font-size: 24px;
      font-weight: 800;
      color: var(--md-sys-color-primary);
      pointer-events: none;
      z-index: 10;
      animation: floatUp 0.8s cubic-bezier(0, 0, 0.2, 1) forwards;
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-60px) scale(1.3);
      }
    }

    /* Стили для разлетающихся частиц */
    .particle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      animation: particleExplode 0.6s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }

    @keyframes particleExplode {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(var(--dx), var(--dy)) scale(0);
      }
    }

    /* Панель улучшений */
    .upgrade-section {
      width: 100%;
    }

    .upgrade-card {
      background-color: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-primary-container);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      border: none;
      width: 100%;
      text-align: left;
      transition: transform 0.1s, opacity 0.2s, background-color 0.3s ease;
    }

    .upgrade-card:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .upgrade-card:not(:disabled):active {
      transform: scale(0.98);
    }

    .upgrade-info h4 {
      font-size: 16px;
      font-weight: 800;
    }

    .upgrade-info p {
      font-size: 12px;
      margin-top: 2px;
      opacity: 0.8;
    }

    .upgrade-price {
      background-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      padding: 8px 14px;
      border-radius: var(--md-shape-corner-full);
      font-weight: 800;
      font-size: 14px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="top-bar">
      <div class="header-tag">M3 EXPRESSIVE</div>
      <button class="theme-toggle" id="theme-btn" aria-label="Toggle theme">
        <!-- Иконка Луны/Солнца -->
        <svg id="theme-icon" viewBox="0 0 24 24">
          <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4C12.92 3.04 12.46 3 12 3z"/>
        </svg>
      </button>
    </div>

    <div class="score-display">
      <div class="score-value" id="score">0</div>
      <div class="score-label">ОЧКОВ</div>
    </div>

    <div class="click-button-wrapper" id="button-container">
      <button class="click-button" id="click-btn">
        <svg class="click-icon" viewBox="0 0 24 24">
          <path d="M7.5 11C9.43 11 11 9.43 11 7.5S9.43 4 7.5 4 4 5.57 4 7.5 5.57 11 7.5 11zm0-5.5c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm0 13.5c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm0-5.5c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm9-2.5c1.93 0 3.5-1.57 3.5-3.5S18.43 4 16.5 4 13 5.57 13 7.5s1.57 3.5 3.5 3.5zm0-5.5c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2z"/>
        </svg>
      </button>
    </div>

    <div class="upgrade-section">
      <button class="upgrade-card" id="upgrade-btn" disabled>
        <div class="upgrade-info">
          <h4>Усилить клик</h4>
          <p>+1 очко за клик</p>
        </div>
        <div class="upgrade-price" id="upgrade-price">10</div>
      </button>
    </div>
  </div>

  <script>
    let score = 0;
    let clickPower = 1;
    let upgradeCost = 10;
    let isDark = false;

    const scoreEl = document.getElementById('score');
    const clickBtn = document.getElementById('click-btn');
    const buttonContainer = document.getElementById('button-container');
    const upgradeBtn = document.getElementById('upgrade-btn');
    const upgradePriceEl = document.getElementById('upgrade-price');
    const themeBtn = document.getElementById('theme-btn');
    const themeIcon = document.getElementById('theme-icon');

    // SVG пути для Солнца и Луны
    const moonPath = "M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4C12.92 3.04 12.46 3 12 3z";
    const sunPath = "M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zM7.05 18.36l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.39.39-1.03 0-1.41s-1.02-.39-1.41 0zm12.37-12.37l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.39.39-1.03 0-1.41s-1.02-.39-1.41 0z";

    // Переключение темы
    themeBtn.addEventListener('click', () => {
      isDark = !isDark;
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      themeIcon.querySelector('path').setAttribute('d', isDark ? sunPath : moonPath);
    });

    // Обработка клика
    clickBtn.addEventListener('click', (e) => {
      score += clickPower;
      updateUI();
      createFloatingText(`+${clickPower}`, e);
      spawnParticles(e);
    });

    // Покупка улучшений
    upgradeBtn.addEventListener('click', () => {
      if (score >= upgradeCost) {
        score -= upgradeCost;
        clickPower += 1;
        upgradeCost = Math.floor(upgradeCost * 1.5);
        updateUI();
      }
    });

    function updateUI() {
      scoreEl.textContent = score;
      upgradePriceEl.textContent = upgradeCost;
      upgradeBtn.disabled = score < upgradeCost;
    }

    function createFloatingText(text, event) {
      const el = document.createElement('div');
      el.className = 'floating-text';
      el.textContent = text;

      const rect = buttonContainer.getBoundingClientRect();
      const x = event.clientX - rect.left - 10;
      const y = event.clientY - rect.top - 20;

      el.style.left = `${x}px`;
      el.style.top = `${y}px`;

      buttonContainer.appendChild(el);
      setTimeout(() => el.remove(), 800);
    }

    // Генерация разлетающихся частиц
    function spawnParticles(event) {
      const particleCount = 12;
      const rect = buttonContainer.getBoundingClientRect();
      const centerX = event.clientX - rect.left;
      const centerY = event.clientY - rect.top;

      const colors = ['var(--particle-1)', 'var(--particle-2)', 'var(--particle-3)'];

      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';

        // Размер от 6px до 12px
        const size = Math.random() * 6 + 6;
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];

        // Случайный угол и дистанция разлета
        const angle = Math.random() * Math.PI * 2;
        const distance = Math.random() * 80 + 40;
        const dx = Math.cos(angle) * distance;
        const dy = Math.sin(angle) * distance;

        particle.style.left = `${centerX - size / 2}px`;
        particle.style.top = `${centerY - size / 2}px`;
        particle.style.setProperty('--dx', `${dx}px`);
        particle.style.setProperty('--dy', `${dy}px`);

        buttonContainer.appendChild(particle);
        setTimeout(() => particle.remove(), 600);
      }
    }
  </script>
</body>
  </html>
